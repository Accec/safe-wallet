[workspace]
members = [
  "crates/wallet_core",
  "crates/wallet_ffi",
  "crates/wallet_cli"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.10"
alloy-consensus = "2.0.5"
alloy-eips = "2.0.5"
alloy-primitives = "1.6.0"
alloy-signer = "2.0.5"
alloy-signer-local = "2.0.5"
base64 = "0.22"
bip32 = "0.5.3"
bip39 = { version = "2", features = ["rand"] }
bitcoin = "0.32.100"
bs58 = "0.5.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
k256 = "0.13.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signer-tron = "1.0"
tempfile = "3"
thiserror = "2"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
